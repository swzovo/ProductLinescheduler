name: Build Windows desktop package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Windows package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build_desktop.ps1

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: ProductionLineScheduler-Windows-x64
          path: release/产线排班系统-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
